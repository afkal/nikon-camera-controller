[project]
name = "nikon-camera-controller"
version = "0.1.0"
description = "Standalone web application for controlling Nikon cameras via USB"
requires-python = ">=3.11"
license = "CC-BY-NC-4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E402", "F403", "F405", "F811"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# FastHTML uses wildcard imports and route decorators that redefine
# get/post function names — these are false positives in main.py.
[[tool.mypy.overrides]]
module = "app.main"
disable_error_code = ["name-defined", "no-redef", "no-untyped-def"]

[tool.black]
line-length = 88
target-version = ["py311"]
