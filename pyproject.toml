[project]
name = "nikon-camera-controller"
version = "0.1.0"
description = "Standalone web application for controlling Nikon cameras via USB"
requires-python = ">=3.11"
license = "CC-BY-NC-4.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 88
target-version = ["py311"]
